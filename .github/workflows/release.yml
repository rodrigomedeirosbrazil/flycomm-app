# Monta o APK Android de uma tag de release e publica no GitHub Releases.
#
# iOS fica de fora de propósito, como no fly-app: sem certificado de
# distribuição não há build headless assinável, e a instalação expiraria em
# 7 dias. iOS sai do Mac, pelo cabo.
name: release

on:
  push:
    # Tags são AAAA-MM-DD.N — 2026-09-15.1. O padrão é estrito de propósito:
    # tag digitada errada não pode virar build com versionCode errado.
    tags:
      - '2[0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9].[0-9]*'
  workflow_dispatch:

permissions:
  contents: write   # necessário para criar o Release

env:
  FLUTTER_VERSION: '3.47.3'
  # SHA-256 do certificado de release (CN=Aerovolt, O=Medeirostec) — a mesma
  # keystore do fly-app. O build de release cai nas chaves de DEBUG quando
  # key.properties falta, em silêncio e com sucesso; um secret vazio ou
  # digitado errado publicaria um APK que nenhum piloto consegue instalar por
  # cima do que já tem. Esta impressão digital é o que transforma esse
  # fallback silencioso em job quebrado.
  SIGNING_CERT_SHA256: 'a06f34a6c39d6394c7e04c611c6d63874cafc89672ca0818764f37a7dd34768b'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- versão -------------------------------------------------------
      # versionName é a tag literal. versionCode precisa ser inteiro sempre
      # crescente, então a tag vira AAAAMMDDNN — abaixo do teto de
      # 2_100_000_000 do Android até 2100, e com N limitado a 99 por dia.
      - name: Derivar versão da tag
        id: version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          DATE="${TAG%.*}"
          N="${TAG##*.}"
          if [ "$N" -gt 99 ]; then
            echo "::error::N=$N passa de 99; versionCode deixaria de crescer."
            exit 1
          fi
          CODE="$(echo "$DATE" | tr -d '-')$(printf '%02d' "$N")"
          echo "name=$TAG"  >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "versionName=$TAG  versionCode=$CODE"

      # --- toolchain ----------------------------------------------------
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # compileSdk vem do Flutter (37 com minor 0). O Google publica essa
      # plataforma só como `platforms;android-37.0`, e ela não vem no SDK
      # pré-instalado do runner.
      # packages vazio de propósito: o default da action instala o pacote
      # legado `tools`, que o Google já removeu do repositório — e a action
      # morre antes de chegar no build.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Instalar a plataforma Android 37.0
        run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"

      - uses: subosito/flutter-action@v2
        with:
          # Fixado, não `stable`: um release novo do Flutter não pode mudar
          # o que um re-run de uma tag antiga produz.
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # *.g.dart é gitignored — o código do drift nasce aqui, não no repo.
      # Sem este passo o analyze quebra em LocalMessage e HistoryDatabase.
      - name: Gerar o código do drift
        run: dart run build_runner build --delete-conflicting-outputs

      # --- portões ------------------------------------------------------
      # --no-fatal-infos: os infos de lint não seguram um release. Erro e
      # warning ainda derrubam o job.
      - run: flutter analyze --no-fatal-infos

      # test/integration/ fala com o flycomm-server de verdade (docker compose
      # com seed) e não roda no runner. O resto é onde mora a correção.
      - name: Testes de unidade
        run: flutter test test/audio test/history test/room test/ui

      # --- assinatura ---------------------------------------------------
      - name: Restaurar a keystore de release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::secret $v vazio — não vou publicar um release assinado com debug."
              exit 1
            fi
          done
          KS="${RUNNER_TEMP}/aerovolt-upload.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
          # android/key.properties é gitignored e lido pelo app/build.gradle.kts
          # exatamente como na máquina do dev; nenhuma mudança no Gradle.
          cat > android/key.properties <<EOF
          storeFile=$KS
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # --- build --------------------------------------------------------
      # Um APK universal, não --split-per-abi: isso vai na mão para o piloto,
      # e três arquivos são três chances de instalar o errado.
      - name: Build do APK de release
        run: |
          flutter build apk --release \
            --build-name='${{ steps.version.outputs.name }}' \
            --build-number='${{ steps.version.outputs.code }}'

      - name: Conferir que o APK saiu com a chave de release
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -1)"
          ACTUAL="$("$APKSIGNER" verify --print-certs \
            build/app/outputs/flutter-apk/app-release.apk \
            | grep -i 'SHA-256 digest' | head -1 | awk '{print $NF}')"
          echo "certificado: $ACTUAL"
          if [ "$ACTUAL" != "$SIGNING_CERT_SHA256" ]; then
            echo "::error::APK NÃO está assinado com a chave de release (esperado $SIGNING_CERT_SHA256)."
            exit 1
          fi

      - name: Conferir a versão que chegou no manifest
        run: |
          set -euo pipefail
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 | sort -V | tail -1)"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | head -1

      # --- publicação ---------------------------------------------------
      - name: Preparar o artefato
        id: artifact
        run: |
          set -euo pipefail
          OUT="flycomm-${{ steps.version.outputs.name }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$OUT"
          echo "sha256=$(sha256sum "$OUT" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.path }}
          name: ${{ steps.version.outputs.name }}
          body: |
            APK Android da sala de pilotos, para instalar direto no aparelho.

            Instalação por cima de uma versão anterior (preserva o histórico):

                adb install -r ${{ steps.artifact.outputs.path }}

            | | |
            |---|---|
            | versionName | `${{ steps.version.outputs.name }}` |
            | versionCode | `${{ steps.version.outputs.code }}` |
            | SHA-256 | `${{ steps.artifact.outputs.sha256 }}` |
